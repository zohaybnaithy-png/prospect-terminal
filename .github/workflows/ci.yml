# Minimal CI for pull requests and main (docs/VERCEL.md, *CI*). No secrets, no database, no deploy:
# every step runs on fictional fixture data only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The default (single-server) build: no snapshot, no database, no CDN rules.
      - run: npm run build

  cdn-e2e:
    name: Snapshot build and CDN caching end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Writes a fictional snapshot, builds with PT_DATA_SOURCE=snapshot and checks cache headers
      # against `next start` with an unreachable DATABASE_URL.
      - run: npm run test:cdn:e2e

  nav-e2e:
    name: Client navigation end to end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      # Two fictional snapshot builds, `next start` and headless Chromium: router cache, pending
      # hint, filters and levels across history, 404s, headers and a redeploy on the same origin.
      - run: npm run test:nav:e2e

  views-e2e:
    name: Precomputed view models end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One snapshot build with precomputed views, served with views off and on: HTML, RSC
      # payloads, statuses and headers must be byte-identical.
      - run: npm run test:views:e2e
